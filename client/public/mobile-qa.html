<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIDOR · Phone QA</title><style>*{box-sizing:border-box}body{background:#080f11;color:#dfd0b3;font:14px/1.5 system-ui;margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 8px 20px}.controls{display:flex;align-items:center;gap:12px;margin-bottom:9px}select{background:#142923;color:#f0d4a0;border:1px solid #8f7852;border-radius:8px;padding:6px 11px}iframe{border:0;background:#0b1718;width:100%;height:100%;display:block}.device{border-radius:33px;border:8px solid #323b3e;background:#111;box-shadow:0 0 0 2px #778080,0 23px 55px #0007;overflow:hidden;width:calc(var(--phone-width) + 16px);height:calc(var(--phone-height) + 16px);max-width:99vw}.label{margin-top:9px;text-align:center;color:#8a9d93;font-size:11px}.tip{max-width:600px;font-size:12px;color:#91a799;text-align:center;margin-top:8px}</style></head><body><div class="controls"><b>PIDOR · MOBILE QA</b><select id="size" aria-label="Размер телефона"><option value="390x844">390 × 844</option><option value="360x740">360 × 740</option><option value="320x568">320 × 568</option><option value="430x932">430 × 932</option></select></div><div id="device" class="device"><iframe src="/" title="Мобильная версия игры"></iframe></div><div class="label" id="label"></div><div class="tip">Тестовый просмотр: сайт открывается внутри узкого окна с настоящими CSS media queries. Это не эмуляция Telegram или сенсорного устройства.</div><script>const sel=document.getElementById('size'),frame=document.getElementById('device'),label=document.getElementById('label');function resize(){const [w,h]=sel.value.split('x');frame.style.setProperty('--phone-width',w+'px');frame.style.setProperty('--phone-height',h+'px');label.textContent='Viewport iframe: '+w+' × '+h+'px';}sel.addEventListener('change',resize);resize();</script></body></html>
